<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Navani</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      .main {
        height: 100vh;
        width: 100%;
        background-color: grey;
      }

      .nav {
        height: 10vh;
        width: 100%;
        background-color: #fffc8c;
        /* display: flex; */
      }

      .nav ul {
        width: 40%;
        height: 10vh;
        display: flex;
        justify-content: space-evenly;
        align-items: center;
      }

      .nav ul li {
        list-style: none;
      }

      .nav ul li a {
        text-decoration: none;
        color: #000000;
        position: relative;
      }

      .nav ul li a::before {
        content: "";
        height: 2px;
        width: 0px;
        background-color: #bf092f;
        display: block;
        transition: all 1.5s linear;
        position: absolute;
        top: -5px;
        
      }

      .nav ul li a:hover::before {
        content: "";
        height: 2px;
        width: 45px;
        background-color: #bf092f;
      }
      .nav ul li a::after {
        content: "";
        height: 2px;
        width: 0px;
        background-color: #bf092f;
        display: block;
        transition: all 1.5s linear;
        position: absolute;
        bottom: -5;
        right: 50%;
      }

       .nav ul li a:hover::after {
        content: "";
        height: 2px;
        width:45px;
        background-color: #bf092f;
        right: 0;
      }
     
    </style>
  </head>
  <body>
    <div class="main">
      <div class="nav">
        <ul>
          <li><a href="">Home</a></li>
          <li><a href="">About</a></li>
          <li><a href="">Help</a></li>
          <li><a href="">Contact</a></li>
          <li><a href="">Feedback</a></li>
        </ul>
      </div>
    </div>
  </body>
</html>
